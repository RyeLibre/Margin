# Builds the Android app (Margin.apk) each time the code changes, and puts it on the
# "Margin for Android" release page: https://github.com/RyeLibre/margin/releases/latest
name: Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Put Margin's pages into the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html app.js epub.js tts-worker.js icon.png icon.svg manifest.webmanifest android/app/src/main/assets/www/
          cp -r lib android/app/src/main/assets/www/lib
      - name: Signing key (the same every time, so updates install over the old app)
        id: key
        env:
          PW: ${{ secrets.MARGIN_KEY_PASSWORD }}
        run: |
          # the key is stored in the repository locked with the MARGIN_KEY_PASSWORD secret
          pw=$(printf '%s' "$PW" | tr -d ' \r\n\t')
          if [ -n "$pw" ] && openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/margin.p12.enc -out android/app/margin.p12 -pass pass:"$pw" 2>/dev/null \
             && [ "$(sha256sum android/app/margin.p12 | cut -c1-64)" = "feaf1f72bf671452cb67b79edee64abb41be3c8ff8bebf0a706e96cc9a3d9fe3" ]; then
            echo "real=yes" >> "$GITHUB_OUTPUT"; echo "Signing with the Margin key"
          else
            echo "::warning::MARGIN_KEY_PASSWORD is missing or wrong, so this build is only a test and is not published."
            rm -f android/app/margin.p12
            keytool -genkeypair -keystore android/app/margin.p12 -storetype pkcs12 -alias margin -keyalg RSA -keysize 2048 \
              -validity 30 -storepass margin -keypass margin -dname "CN=Margin test build"
            echo "real=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        working-directory: android
        env:
          MARGIN_KEY_PASSWORD: ${{ steps.key.outputs.real == 'yes' && secrets.MARGIN_KEY_PASSWORD || 'margin' }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect
        run: cp android/app/build/outputs/apk/release/app-release.apk Margin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Margin-apk
          path: Margin.apk
      - name: Publish on the release page
        if: steps.key.outputs.real == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Margin.apk --latest \
            --title "Margin for Android (build ${{ github.run_number }})" \
            --notes "Download **Margin.apk** below on your Android phone and open it to install. The first time, allow your browser or Files app to install apps (Android asks). Later builds install over this one and keep your books, notes and words."

  # starts the app in an Android emulator and saves screenshots and the page's messages
  # on the "ci-check" branch
  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Margin-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: pip install websockets==12.0
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 ci/android_check.py Margin.apk || true
      - name: Save the results on the ci-check branch
        if: always()
        run: |
          mkdir -p ci-out && cd ci-out
          git init -q && git checkout -q -b ci-check
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "check ${{ github.run_number }}" --allow-empty
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-check
